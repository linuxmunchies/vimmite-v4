---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ilyaz/LACT
    install:
      packages:
        # LACT's native package includes both its GUI and privileged daemon.
        - lact
        - input-remapper
        - steam-devices
        - mesa-vulkan-drivers.i686
    remove:
      packages:
        # The target fleet is AMD/Intel only. Generic upstream kernel modules
        # remain part of Fedora's standard kernel.
        - nvidia-gpu-firmware

  - type: systemd
    system:
      enabled:
        - lactd.service
        - input-remapper.service

  # Preserve Bazzite's useful labeled-drive automount behavior without making
  # it active on every target. The matching ujust command opts a machine in.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
    install:
      packages:
        - ublue-os-media-automount-udev
